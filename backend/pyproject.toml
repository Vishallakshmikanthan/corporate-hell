[project]
name = "corporate-hell-backend"
version = "1.0.0"
description = "CORPORATE HELL(TM) backend: NVIDIA GLM-5.3 AI dialogue service + save persistence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.35",
    "alembic>=1.14",
    "openai>=1.60",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
