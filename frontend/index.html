<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="CORPORATE HELL™ — Synergy is mandatory. Sanity is optional. A satirical 3D office simulation with autonomous AI employees." />
    <title>CORPORATE HELL™ — Synergy is mandatory. Sanity is optional.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2316161d'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23b8e04a' font-family='sans-serif' font-weight='bold'%3ECH%3C/text%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101114;
        color: #f6f3ea;
        font-family: system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: radial-gradient(ellipse at 50% 40%, #1b1e24 0%, #101114 65%);
        z-index: 9999;
      }
      #boot-splash .logo {
        font-size: clamp(28px, 6vw, 44px);
        font-weight: 900;
        letter-spacing: 0.08em;
        color: #f6f3ea;
      }
      #boot-splash .logo span {
        color: #b8e04a;
      }
      #boot-splash .tag {
        color: #9aa3b2;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #boot-splash .bar {
        width: 180px;
        height: 3px;
        border-radius: 99px;
        background: #2a2e37;
        overflow: hidden;
        margin-top: 10px;
      }
      #boot-splash .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: #b8e04a;
        border-radius: 99px;
        animation: boot 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot {
        from {
          transform: translateX(-60%);
        }
        to {
          transform: translateX(220%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="logo">CORPORATE <span>HELL™</span></div>
        <div class="tag">Synergy is mandatory. Sanity is optional.</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
