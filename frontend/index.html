<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="CORPORATE HELL™ — Synergy is mandatory. Sanity is optional. A satirical 3D office simulation with autonomous AI employees." />
    <title>CORPORATE HELL™ — Executive Simulation & AI World</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23181411' stroke='%23d4a84f' stroke-width='4'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%23d4a84f' font-family='Georgia, serif' font-weight='bold'%3ECH%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14110e;
        color: #faf7f0;
        font-family: system-ui, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: radial-gradient(ellipse at 50% 40%, #241e18 0%, #14110e 68%);
        z-index: 9999;
      }
      #boot-splash .logo {
        font-family: "Playfair Display", "Cormorant Garamond", Georgia, serif;
        font-size: clamp(28px, 6vw, 46px);
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #faf7f0;
      }
      #boot-splash .logo span {
        color: #d4a84f;
      }
      #boot-splash .tag {
        color: #b5a695;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #boot-splash .bar {
        width: 180px;
        height: 3px;
        border-radius: 99px;
        background: #332b24;
        overflow: hidden;
        margin-top: 10px;
      }
      #boot-splash .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #b88933, #e5c478);
        border-radius: 99px;
        animation: boot 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot {
        from {
          transform: translateX(-60%);
        }
        to {
          transform: translateX(220%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="logo">CORPORATE <span>HELL™</span></div>
        <div class="tag">Synergy is mandatory. Sanity is optional.</div>
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
